# Запуск всей системы: docker compose up --build
# Реестр образов задаётся переменной IMAGE_REGISTRY (по умолчанию — зеркало Docker Hub,
# как в исходном проекте). Для прямого доступа к Docker Hub: IMAGE_REGISTRY=docker.io/library

services:
  backend:
    build:
      context: ./server
      args:
        PYTHON_IMAGE: ${IMAGE_REGISTRY:-dockerhub.timeweb.cloud/library}/python:3.11-slim
    container_name: pea-backend
    ports:
      - "8000:8000"
    depends_on:
      sql_database:
        condition: service_healthy
      weaviate:
        condition: service_started
    env_file:
      - .env
    environment:
      EDUCATION_DATABASE_HOST: sql_database
      EDUCATION_DATABASE_PORT: 5432
      WEAVIATE_HOST: weaviate
      UPLOADS_DIR: /app/uploads
      # демонстрационные курсы и пользователи при первом запуске (false — пустая система)
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: Europe/Minsk
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: weaviate,sql_database,localhost,127.0.0.1,t2v-transformers
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${IMAGE_REGISTRY:-dockerhub.timeweb.cloud/library}/node:22-alpine
        NGINX_IMAGE: ${IMAGE_REGISTRY:-dockerhub.timeweb.cloud/library}/nginx:1.27-alpine
    container_name: pea-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.29.2
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0

  sql_database:
    image: ${IMAGE_REGISTRY:-dockerhub.timeweb.cloud/library}/postgres:18
    container_name: pea-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${EDUCATION_DATABASE_NAME:-education_database}
      POSTGRES_USER: ${EDUCATION_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${EDUCATION_DATABASE_PASS:-postgres}
      TZ: Europe/Minsk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  # Локальная модель эмбеддингов — только при EMBEDDING_PROVIDER=local
  # (docker compose --profile local-embeddings up)
  t2v-transformers:
    profiles: ["local-embeddings"]
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2

volumes:
  postgres_data:
  weaviate_data:
  uploads_data:
